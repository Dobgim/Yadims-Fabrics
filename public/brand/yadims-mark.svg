<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="YADIMS Fabrics &amp; Seams">
  <!-- Solid house green disc -->
  <circle cx="50" cy="50" r="50" fill="#0E6B43"/>
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.55"/>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Loose thread, looping in from the left -->
    <path d="M20 62 C26 52 33 68 40 57 C45 49 39 43 33 47 C27 51 31 60 38 60 C48 60 55 47 66 44"
          stroke-width="2.4"/>
    <!-- Thread carrying on past the needle -->
    <path d="M64 43 C70 41 76 41 81 43" stroke-width="2.4"/>
  </g>

  <!-- Needle: long taper with an open eye -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M60.5 26 L60.5 82" stroke-width="2.6"/>
    <ellipse cx="60.5" cy="37" rx="3.4" ry="8" stroke-width="2"/>
  </g>
</svg>
