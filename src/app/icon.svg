<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="YADIMS Fabrics &amp; Seams">
  <!-- White disc + house-green ring, matching the shop's glass sign -->
  <circle cx="50" cy="50" r="50" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="44.5" fill="none" stroke="#0E6B43" stroke-width="6"/>

  <!-- Needle-and-thread mark, in house green (same mark as the sign) -->
  <g fill="none" stroke="#0E6B43" stroke-linecap="round" stroke-linejoin="round">
    <!-- Loose thread, looping in from the left -->
    <path d="M22 62 C27.5 53 34 67 40 57 C44.5 49.5 39 44 33.5 47.5 C28 51 31.5 59.5 38 59.5 C47.5 59.5 54 47.5 65 44.5"
          stroke-width="3.2"/>
    <!-- Thread carrying on past the needle -->
    <path d="M64 43.5 C69.5 41.5 75 41.5 79 43.5" stroke-width="3.2"/>
  </g>

  <!-- Needle: long taper with an open eye -->
  <g fill="none" stroke="#0E6B43" stroke-linecap="round">
    <path d="M60.5 28 L60.5 79" stroke-width="3.4"/>
    <ellipse cx="60.5" cy="38" rx="3.3" ry="7.5" stroke-width="2.4"/>
  </g>
</svg>
